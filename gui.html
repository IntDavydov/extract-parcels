<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kadastrova Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #16213e;
      border-radius: 10px;
      padding: 40px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    h2 { color: #e94560; margin-bottom: 8px; font-size: 22px; }
    p.hint { color: #888; font-size: 13px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      background: #0f3460;
      border: 1px solid #2a4a7f;
      border-radius: 6px;
      color: #fff;
      outline: none;
      margin-bottom: 20px;
    }
    input[type="text"]:focus { border-color: #e94560; }
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #c73652; }
    button:disabled { background: #555; cursor: default; }
    #status { margin-top: 14px; font-size: 13px; color: #6af; text-align: center; min-height: 18px; }
    .tip { margin-top: 18px; font-size: 12px; color: #555; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🗺 Kadastrova Scraper</h2>
    <p class="hint">Open kadastrova-karta.com in your browser, navigate to the area you want, then copy the URL from the address bar and paste it below.</p>
    <label for="url">kadastrova-karta.com URL</label>
    <input type="text" id="url"
      value="https://kadastrova-karta.com/#13.95/46.64265/31.4905"
      placeholder="https://kadastrova-karta.com/#zoom/lat/lng" />
    <button id="btn" onclick="run()">▶ Start Scraping</button>
    <div id="status"></div>
    <p class="tip">Press Ctrl+C in the console window to stop and save the JSON file.</p>
  </div>
  <script>
    function run() {
      const url = document.getElementById('url').value.trim();
      if (!url.startsWith('http')) {
        document.getElementById('status').textContent = '⚠ Please enter a valid URL.';
        return;
      }
      document.getElementById('btn').disabled = true;
      document.getElementById('status').textContent = '⏳ Navigating to map...';
      window.__startScraping(url);
    }
    document.getElementById('url').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') run();
    });
  </script>
</body>
</html>
