<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Land Management WPD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="main-layout">
    <div class="controls-col">
      <div class="card">
        <div class="left-tabs" role="tablist" aria-label="WPD tabs">
          <button class="left-tab-btn active" data-tab-target="tab-panel-parcels" role="tab" aria-selected="true">🗺 Kadastr parcels</button>
          <button class="left-tab-btn" data-tab-target="tab-panel-eland" role="tab" aria-selected="false">📋 e.land lookup</button>
        </div>

        <div class="left-tab-panel active" id="tab-panel-parcels" role="tabpanel">
          <div class="field">
            <label>Boundary KMZ/KML <span style="color:#e05;">*required</span> <span style="color:#888;font-size:11px;">(single or multiple files)</span></label>
            <div id="drop-zone" class="drop-zone">
              <div id="drop-hint">📎 Click to attach or drop KMZ/KML files here</div>
              <div id="boundary-list"></div>
              <button class="btn btn-secondary btn-sm" id="btn-clear-boundary" style="display:none;margin-top:6px;">✕ Clear all</button>
            </div>
          </div>

          <div class="field">
            <label>Output folder <span style="color:#e05;">*required</span></label>
            <div class="row">
              <button class="btn btn-secondary btn-sm" id="btn-pick-folder">📁 Choose folder</button>
              <span class="path-display" id="output-folder-display">not selected</span>
            </div>
          </div>

          <div class="row">
            <button class="btn btn-primary" id="btn-start" disabled>▶ Start Kadastr scraping</button>
            <button class="btn btn-danger" id="btn-stop" style="display:none;">⛔ Stop</button>
          </div>
        </div>

        <div class="left-tab-panel" id="tab-panel-eland" role="tabpanel">
          <div class="field">
            <label>Cadnums CSV <span style="color:#e05;">*required</span> <span style="color:#888;font-size:11px;">(from scraper, e.g. *_cadnums.csv)</span></label>
            <div class="row">
              <button class="btn btn-secondary btn-sm" id="btn-pick-csv">📎 Choose CSV</button>
              <span class="path-display" id="csv-display">not selected</span>
            </div>
          </div>

          <div class="field">
            <label>Output format</label>
            <select id="eland-output-format">
              <option value="xlsx_full" selected>Excel Full (.xlsx)</option>
              <option value="xlsx_partial">Excel Partial (.xlsx)</option>
            </select>
            <div style="font-size:11px;color:#8bb4ff;margin-top:4px;">Word (.docx) is generated automatically with Excel output.</div>
          </div>

          <div class="field">
            <label id="output-file-label">Output XLSX <span style="color:#e05;">*required</span></label>
            <div class="row">
              <button class="btn btn-secondary btn-sm" id="btn-pick-output-file">💾 Choose output file</button>
              <span class="path-display" id="output-file-display">not selected</span>
            </div>
          </div>

          <div class="row">
            <button class="btn btn-primary" id="btn-eland-start" disabled>🔍 Lookup on e.land</button>
            <button class="btn btn-danger" id="btn-eland-stop" style="display:none;">⛔ Stop</button>
          </div>
        </div>
      </div>
    </div>

    <div class="log-col">
      <div class="card">
        <h2>Log</h2>
        <div class="log-area" id="main-log"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
